[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-crypto-flow"
version = "0.4.1"
description = "Reproducible cross-venue order-flow research for crypto prediction markets"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
stream = ["websockets>=15,<17", "cryptography>=45,<51"]

[project.scripts]
kalshi-lab = "kalshi_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["kalshi_lab*"]
