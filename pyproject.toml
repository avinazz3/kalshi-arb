[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-crypto-flow"
version = "0.6.1"
description = "Settlement-aware probability benchmarks and read-only crypto prediction-market research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["cryptography>=45,<51"]

[project.scripts]
kalshi-lab = "kalshi_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["kalshi_lab*"]
