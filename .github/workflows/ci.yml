name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[stream]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic stream capture and inspection
        run: |
          kalshi-lab demo --db data/demo.sqlite
          kalshi-lab inspect --db data/demo.sqlite
      - name: Hypothetical entry and exit fees
        run: |
          kalshi-lab fees --input examples/fee_orders.json --balance-precision 0.0001
          kalshi-lab fees --input examples/fee_orders.json --balance-precision 0.01
