name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[stream]'
      - name: Unit tests
        run: python tests/run_checks.py
      - name: Synthetic stream capture and inspection
        run: |
          kalshi-lab demo --db data/demo.sqlite
          kalshi-lab inspect --db data/demo.sqlite
      - name: Hypothetical entry and exit fees
        run: |
          kalshi-lab fees --input examples/fee_orders.json --balance-precision 0.0001
          kalshi-lab fees --input examples/fee_orders.json --balance-precision 0.01
      - name: Hand-checkable research dataset
        run: |
          kalshi-lab research-demo --db data/research_demo.sqlite
          kalshi-lab replay --db data/research_demo.sqlite
          kalshi-lab dataset --db data/research_demo.sqlite --out data/research.jsonl
          python -c "import json; from pathlib import Path; r=[json.loads(line) for line in Path('data/research.jsonl').read_text().splitlines()]; assert len(r)==7; assert r[1]['features']['signed_aggressive_notional_usd']=='25.0100'; assert r[1]['targets']['midpoint_change_1000ms']=='0.0050'"
